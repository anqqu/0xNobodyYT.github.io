<body>
<div class="loading"><p><b>Loading Sword x Staff Server Calendar…</b><br>If it does not open, <a href="../sxs-primo-calculator/?view=calendar" style="color:#71d8e9">use the calendar fallback</a>.</p></div>
<script>
const calendarSource=`../sxs-primo-calculator/index.html?v=${Date.now()}`;
fetch(calendarSource,{cache:"no-store"}).then(response=>{if(!response.ok)throw new Error("Calendar source unavailable");return response.text()}).then(html=>{document.open();document.write(html);document.close()}).catch(()=>document.querySelector(".loading b").textContent="The calendar could not be loaded.");
</script>

<!-- 1. СТИЛИ: скрытие белой полосы Google + спиннер и кнопки -->
<style>
  /* Скрываем верхнюю белую полосу Google Translate */
  .goog-te-banner-frame,
  .goog-te-banner-frame.skiptranslate,
  iframe.goog-te-banner-frame,
  body > .skiptranslate:first-child {
    display: none !important;
    visibility: hidden !important;
    height: 0 !important;
  }

  /* Убираем сдвиг сайта вниз */
  body {
    top: 0px !important;
    position: static !important;
  }

  /* Анимация вращения спиннера */
  @keyframes lang-spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .lang-spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid rgba(255, 255, 255, 0.25);
    border-top-color: currentColor;
    border-radius: 50%;
    animation: lang-spin 0.6s linear infinite;
    vertical-align: middle;
  }

  /* Оформление кнопок RU / EN */
  .lang-btn {
    cursor: pointer;
    padding: 10px 20px;
    border: 1px solid transparent;
    border-radius: 9px;
    background: #142838;
    color: #a8c6e8;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.5px;
    transition: all 0.25s ease;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 65px;
    height: 40px;
    box-sizing: border-box;
    font-family: inherit;
  }

  .lang-btn:hover {
    transform: translateY(-2px);
    border-color: #294458;
    color: #fff;
  }

  /* Подсветка активной кнопки */
  .lang-btn.active {
    background: #63dbef !important;
    color: #080d14 !important;
    box-shadow: 0 0 14px rgba(99, 219, 239, 0.5);
  }
</style>

<!-- 2. СКРЫТЫЙ КОНТЕЙНЕР GOOGLE TRANSLATE -->
<div id="google_translate_element" style="display:none;"></div>

<!-- 3. КНОПКИ ПЕРЕКЛЮЧЕНИЯ ЯЗЫКА -->
<div id="lang-switch-box" class="notranslate" translate="no" style="position:fixed;bottom:20px;right:20px;z-index:999999;display:flex;gap:8px;background:#0d1823;padding:8px;border-radius:12px;border:1px solid #294458;box-shadow:0 8px 25px rgba(0,0,0,0.7);font-family:sans-serif;">
  <button type="button" class="notranslate lang-btn" translate="no" onclick="setSiteLanguage('ru')" id="btn-lang-ru">RU</button>
  <button type="button" class="notranslate lang-btn" translate="no" onclick="setSiteLanguage('en')" id="btn-lang-en">EN</button>
</div>

<!-- 4. ЛОГИКА С РЕАЛЬНЫМ ОТСЛЕЖИВАНИЕМ ЗАВЕРШЕНИЯ ПЕРЕВОДА -->
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'en,ru',
      autoDisplay: false
    }, 'google_translate_element');
  }

  // Отслеживание РЕАЛЬНОГО момента, когда Google закончил перевод страницы
  function waitForGoogleTranslateFinish(callback) {
    // Google ставит класс "translated-ltr" к тегу <html>, когда перевод готов
    if (document.documentElement.classList.contains('translated-ltr')) {
      callback();
      return;
    }

    // Слушаем изменение классов тега <html> в реальном времени
    const observer = new MutationObserver(function(mutations, obs) {
      if (document.documentElement.classList.contains('translated-ltr')) {
        obs.disconnect();
        callback();
      }
    });

    observer.observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['class']
    });

    // Страховочный таймаут (если переводчик отработал без события или сеть тормозит)
    setTimeout(function() {
      observer.disconnect();
      callback();
    }, 5000);
  }

  // Инициализация состояния кнопок при открытии страницы
  function initLanguageState() {
    const isRu = document.cookie.includes('googtrans=/en/ru');
    const btnRu = document.getElementById('btn-lang-ru');
    const btnEn = document.getElementById('btn-lang-en');
    if (!btnRu || !btnEn) return;

    if (isRu) {
      btnRu.classList.add('active');
      btnEn.classList.remove('active');
      // Включаем реальный спиннер, пока Google не отдал готовый русский текст
      btnRu.innerHTML = '<span class="lang-spinner"></span>';
      btnRu.style.pointerEvents = 'none';

      waitForGoogleTranslateFinish(function() {
        btnRu.innerText = 'RU';
        btnRu.style.pointerEvents = 'auto';
      });
    } else {
      // Английский язык отдаётся сразу
      btnEn.classList.add('active');
      btnRu.classList.remove('active');
      btnEn.innerText = 'EN';
      btnRu.innerText = 'RU';
    }
  }

  // Переключение языка
  function setSiteLanguage(lang) {
    const isRu = lang === 'ru';
    const currentIsRu = document.cookie.includes('googtrans=/en/ru');
    if (isRu === currentIsRu) return;

    const targetBtn = document.getElementById(isRu ? 'btn-lang-ru' : 'btn-lang-en');
    if (targetBtn) {
      targetBtn.innerHTML = '<span class="lang-spinner"></span>';
      targetBtn.style.pointerEvents = 'none';
    }

    const domain = window.location.hostname;
    const paths = ['/', window.location.pathname];
    const subpath = '/' + (window.location.pathname.split('/')[1] || '');
    if (!paths.includes(subpath)) paths.push(subpath);

    if (isRu) {
      paths.forEach(function(p) {
        document.cookie = "googtrans=/en/ru; path=" + p + ";";
        document.cookie = "googtrans=/en/ru; domain=" + domain + "; path=" + p + ";";
        if (domain.includes('.')) {
          document.cookie = "googtrans=/en/ru; domain=." + domain + "; path=" + p + ";";
        }
      });
    } else {
      paths.forEach(function(p) {
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; path=" + p + ";";
        document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=" + domain + "; path=" + p + ";";
        if (domain.includes('.')) {
          document.cookie = "googtrans=; expires=Thu, 01 Jan 1970 00:00:00 UTC; domain=." + domain + "; path=" + p + ";";
        }
      });
    }

    setTimeout(function() {
      location.reload();
    }, 120);
  }

  // Запускаем отслеживание сразу при загрузке
  initLanguageState();
</script>

<!-- 5. ОФИЦИАЛЬНЫЙ СКРИПТ GOOGLE TRANSLATE -->
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

</body>
</html>
