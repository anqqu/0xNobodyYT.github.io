<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Sword x Staff server calendar with season dates, dungeon releases, weekly events and rewards.">
<title>Sword x Staff Server Calendar | 0xNobody</title>
<style>
html,body{margin:0;min-height:100%;background:#090c12;color:#f4f7fb;font:16px/1.5 system-ui,sans-serif}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.loading b{color:#d9e052}
</style>
</head>
<body>
<div class="loading"><p><b>Loading Sword x Staff Server Calendar…</b><br>If it does not open, <a href="../sxs-primo-calculator/?view=calendar" style="color:#71d8e9">use the calendar fallback</a>.</p></div>
<script>
const calendarSource=`../sxs-primo-calculator/index.html?v=${Date.now()}`;
fetch(calendarSource,{cache:"no-store"}).then(response=>{if(!response.ok)throw new Error("Calendar source unavailable");return response.text()}).then(html=>{document.open();document.write(html);document.close()}).catch(()=>document.querySelector(".loading b").textContent="The calendar could not be loaded.");
</script>

<!-- 1. Скрываем белую полоску Google -->
<style>
  .goog-te-banner-frame,
  .goog-te-banner-frame.skiptranslate,
  iframe.goog-te-banner-frame,
  body > .skiptranslate:first-child {
    display: none !important;
    visibility: hidden !important;
    height: 0 !important;
  }
  body {
    top: 0px !important;
    position: static !important;
  }
  #goog-gt-tt, 
  .goog-te-balloon-frame,
  .VIpgJd-ZVi9od-aZ2wEe-wOHMyf {
    display: none !important;
  }
  .goog-text-highlight {
    background: none !important;
    box-shadow: none !important;
  }
</style>

<!-- 2. Скрытый контейнер перевода -->
<div id="google_translate_element" style="display:none;"></div>

<!-- 3. Кнопки переключения RU / EN -->
<div id="lang-switch-box" style="position:fixed;bottom:15px;right:15px;z-index:999999;display:flex;gap:6px;background:#0d1823;padding:5px;border-radius:10px;border:1px solid #294458;box-shadow:0 6px 20px rgba(0,0,0,0.6);font-family:sans-serif;">
  <button type="button" onclick="setSiteLanguage('ru')" id="btn-lang-ru" style="cursor:pointer;padding:6px 14px;border:1px solid transparent;border-radius:7px;background:#142838;color:#a8c6e8;font-weight:800;font-size:12px;transition:0.2s;">RU</button>
  <button type="button" onclick="setSiteLanguage('en')" id="btn-lang-en" style="cursor:pointer;padding:6px 14px;border:1px solid transparent;border-radius:7px;background:#142838;color:#a8c6e8;font-weight:800;font-size:12px;transition:0.2s;">EN</button>
</div>

<!-- 4. Скрипт перевода -->
<script type="text/javascript">
  function googleTranslateElementInit() {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      includedLanguages: 'en,ru',
      autoDisplay: false
    }, 'google_translate_element');
    updateButtonStyles();
  }

  function setSiteLanguage(lang) {
    const select = document.querySelector('.goog-te-combo');
    if (select) {
      select.value = lang;
      select.dispatchEvent(new Event('change'));
    } else {
      document.cookie = "googtrans=/en/" + lang + "; path=/;";
      document.cookie = "googtrans=/en/" + lang + "; domain=" + window.location.hostname + "; path=/;";
      location.reload();
    }
    setTimeout(updateButtonStyles, 300);
  }

  function updateButtonStyles() {
    const isRu = document.cookie.includes('googtrans=/en/ru');
    const btnRu = document.getElementById('btn-lang-ru');
    const btnEn = document.getElementById('btn-lang-en');
    if (!btnRu || !btnEn) return;

    if (isRu) {
      btnRu.style.background = '#63dbef';
      btnRu.style.color = '#080d14';
      btnEn.style.background = '#142838';
      btnEn.style.color = '#a8c6e8';
    } else {
      btnEn.style.background = '#63dbef';
      btnEn.style.color = '#080d14';
      btnRu.style.background = '#142838';
      btnRu.style.color = '#a8c6e8';
    }
  }
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
