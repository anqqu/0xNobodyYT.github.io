name: Auto Sync with Upstream

on:
  schedule:
    # Запуск каждые 6 часов (в 00:00, 06:00, 12:00, 18:00 по UTC)
    - cron: '0 * * * *'
  # Возможность запустить синхронизацию вручную в любой момент
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with original repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Подключаем репозиторий автора
          git remote add upstream https://github.com/0xNobodyYT/0xNobodyYT.github.io.git || true
          git fetch upstream main
          
          # Сливаем изменения автора в наш форк
          git merge upstream/main -m "Auto-sync from upstream" --no-edit || echo "Конфликтов нет или уже актуально"
          
          # Отправляем обновленный сайт
          git push origin main
